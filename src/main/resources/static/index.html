<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estaciona+ • Controle de Placas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
          boxShadow: {
            'glow': '0 0 0 4px rgb(59 130 246 / 20%)',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: 0, transform:'translateY(8px)' }, '100%': { opacity: 1, transform:'translateY(0)'} },
            pop: { '0%': { transform:'scale(0.95)', opacity:0 }, '100%': { transform:'scale(1)', opacity:1 }},
            blink: { '0%,100%':{opacity:.4}, '50%':{opacity:1} }
          },
          animation: {
            fadeIn: 'fadeIn .35s ease-out',
            pop: 'pop .2s ease-out',
            blink: 'blink 1.2s ease-in-out infinite'
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <meta name="color-scheme" content="light dark" />
  <style>
    ::-webkit-scrollbar{ width:10px; height:10px }
    ::-webkit-scrollbar-thumb{ background:rgba(100,100,100,.25); border-radius:999px }
    ::-webkit-scrollbar-track{ background:transparent }
    @media (max-width: 640px){
      button, a, input, select { font-size: 16px; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 selection:bg-blue-200 dark:selection:bg-blue-800/60">
<header class="sticky top-0 z-40 backdrop-blur supports-[backdrop-filter]:bg-white/70 dark:supports-[backdrop-filter]:bg-slate-900/60 border-b border-slate-200/60 dark:border-slate-800">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-3">
    <div class="flex items-center gap-2 font-extrabold tracking-tight text-lg sm:text-xl">
        <span class="inline-flex size-8 items-center justify-center rounded-2xl bg-blue-600 text-white shadow-glow animate-pop">
          <Icon name="parking-square" className="w-5 h-5" />
        </span>
      <a href="#inicio" class="hover:opacity-80 transition">Estaciona+</a>
    </div>
    <nav class="ml-auto hidden sm:flex items-center gap-2 text-sm">
      <a href="#inicio" class="px-3 py-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition">Início</a>
      <a href="#placas" class="px-3 py-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition">Placas</a>
      <a href="#relatorios" class="px-3 py-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition">Relatórios</a>
      <a href="#config" class="px-3 py-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition">Config</a>
    </nav>
    <button id="themeToggle" class="ml-2 inline-flex items-center gap-2 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition text-sm">
      <Icon name="sun" className="w-4 h-4 block dark:hidden" />
      <Icon name="moon" className="w-4 h-4 hidden dark:block" />
      <span class="hidden sm:inline">Tema</span>
    </button>
  </div>
</header>

<main id="root" class="max-w-6xl mx-auto px-3 sm:px-6 py-6"></main>

<footer class="sticky bottom-0 z-40 md:hidden backdrop-blur supports-[backdrop-filter]:bg-white/70 dark:supports-[backdrop-filter]:bg-slate-900/60 border-t border-slate-200/60 dark:border-slate-800">
  <div class="max-w-6xl mx-auto px-4 py-2 flex items-center justify-around text-xs">
    <a href="#inicio" class="flex flex-col items-center gap-1 p-2 rounded-xl active:scale-95 transition"><Icon name="home" className="w-5 h-5" />Início</a>
    <a href="#placas" class="flex flex-col items-center gap-1 p-2 rounded-xl active:scale-95 transition"><Icon name="list-checks" className="w-5 h-5" />Placas</a>
    <a href="#relatorios" class="flex flex-col items-center gap-1 p-2 rounded-xl active:scale-95 transition"><Icon name="pie-chart" className="w-5 h-5" />Relatórios</a>
    <a href="#config" class="flex flex-col items-center gap-1 p-2 rounded-xl active:scale-95 transition"><Icon name="settings" className="w-5 h-5" />Config</a>
  </div>
</footer>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function Icon({name, size = 20, className = ''}){
      const ref = useRef(null);
      useEffect(()=>{
        if(ref.current){
          ref.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          i.className = className;
          ref.current.appendChild(i);
          try { window.lucide?.createIcons?.({root: ref.current}); } catch(e){}
        }
      }, [name, className]);
      return <span ref={ref} style={{display: 'inline-flex', width: size, height: size, alignItems: 'center', justifyContent: 'center'}}></span>;
    }

    const API_BASE = '/Automoveis';

  const METODOS_PAGAMENTO = [
    { value: 'dinheiro', label: 'Dinheiro' },
    { value: 'pix', label: 'Pix' },
  ];

  function formatBRL(value){
    if(value === '' || value === null || value === undefined) return '';
    const n = Number(value) || 0;
    return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  }

  function uuid(){
    return crypto?.randomUUID?.() || ('id-' + Math.random().toString(36).slice(2));
  }

  function metodoLabel(metodo){
    return METODOS_PAGAMENTO.find(m => m.value === metodo)?.label || metodo;
  }

  function somaPagamentos(pagamentos){
    return (pagamentos || []).reduce((s, p) => s + (Number(p.valor) || 0), 0);
  }

  // Compatibiliza itens vindos do back-end antigo (campo único
  // `metodoPagamento`) com o novo formato (`pagamentos: [...]`).
  function migrateItem(item){
    if(Array.isArray(item.pagamentos)){
      return item;
    }
    const pagamentos = (item.pago && item.metodoPagamento)
            ? [{ id: uuid(), metodo: item.metodoPagamento, valor: item.valor }]
            : [];
    const { metodoPagamento, ...rest } = item;
    return { ...rest, pagamentos };
  }

  async function parseErro(res, padrao){
    try{
      const data = await res.json();
      return data?.message || padrao;
    }catch{
      return padrao;
    }
  }

  // --------- Componentes ---------
  function StatCard({icon, label, value, sub}){
    return (
            <div className="group p-3 sm:p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40 shadow-sm hover:shadow-md transition animate-fadeIn">
              <div className="flex items-center gap-2 sm:gap-3">
            <span className="inline-flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 shrink-0 rounded-xl bg-blue-600/10 text-blue-700 dark:text-blue-300">
              <Icon name={icon} className="w-5 h-5" />
            </span>
                <div className="flex-1 min-w-0">
                  <div className="text-[11px] sm:text-xs uppercase tracking-wider text-slate-500 dark:text-slate-400 truncate">{label}</div>
                  <div className="text-lg sm:text-2xl font-semibold truncate">{value}</div>
                  {sub && <div className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 mt-0.5 sm:mt-1">{sub}</div>}
                </div>
              </div>
            </div>
    )
  }

  function Tabs({tab, setTab}){
    const tabs = [
      {id:'todos', label:'Todos', icon:'list'},
      {id:'carro', label:'Carros', icon:'car'},
      {id:'moto', label:'Motos', icon:'motorbike'},
    ];
    return (
            <div className="flex w-full overflow-x-auto gap-2 pb-1 -mx-1 px-1">
              {tabs.map(t => (
                      <button key={t.id}
                              onClick={() => setTab(t.id)}
                              className={
                                      'shrink-0 flex items-center gap-2 px-4 py-2 rounded-2xl border transition ' +
                                      (tab===t.id
                                              ? 'bg-blue-600 text-white border-blue-600 shadow-glow'
                                              : 'bg-white/70 dark:bg-slate-900/40 border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800')
                              }>
                        <Icon name={t.icon} className="w-4 h-4" />
                        <span>{t.label}</span>
                      </button>
              ))}
            </div>
    )
  }

  function PaymentFilter({paymentFilter, setPaymentFilter}){
    const filters = [
      {id:'todos', label:'Todos', icon:'list'},
      {id:'pagos', label:'Pagos', icon:'badge-check'},
      {id:'pendentes', label:'Pendentes', icon:'clock'},
    ];
    return (
            <div className="flex w-full overflow-x-auto gap-2 pb-1 -mx-1 px-1">
              {filters.map(f => (
                      <button key={f.id}
                              onClick={() => setPaymentFilter(f.id)}
                              className={
                                      'shrink-0 flex items-center gap-2 px-4 py-2 rounded-2xl border transition ' +
                                      (paymentFilter===f.id
                                              ? 'bg-blue-600 text-white border-blue-600 shadow-glow'
                                              : 'bg-white/70 dark:bg-slate-900/40 border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800')
                              }>
                        <Icon name={f.icon} className="w-4 h-4" />
                        <span>{f.label}</span>
                      </button>
              ))}
            </div>
    )
  }

  // Editor de pagamento dividido: permite adicionar quantas formas de
  // pagamento forem necessárias até fechar o valor total do veículo.
  function PaymentSplitEditor({valorTotal, pagamentos, setPagamentos}){
    const totalAlocado = somaPagamentos(pagamentos);
    const restante = Math.round((Number(valorTotal||0) - totalAlocado) * 100) / 100;
    const bateCerto = Math.abs(restante) < 0.01;

    function addLinha(){
      setPagamentos(prev => [
        ...prev,
        { id: uuid(), metodo: 'dinheiro', valor: restante > 0 ? restante : '' }
      ]);
    }
    function updateLinha(id, field, value){
      setPagamentos(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
    }
    function removeLinha(id){
      setPagamentos(prev => prev.filter(p => p.id !== id));
    }

    return (
            <div className="grid gap-2 p-3 rounded-xl bg-slate-100/70 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700">
              {pagamentos.length === 0 && (
                      <div className="text-xs text-slate-500 dark:text-slate-400">Nenhuma forma de pagamento adicionada ainda.</div>
              )}
              {pagamentos.map(p => (
                      <div key={p.id} className="flex flex-wrap items-center gap-2">
                        <select value={p.metodo} onChange={e=>updateLinha(p.id,'metodo',e.target.value)}
                                className="flex-1 min-w-[110px] px-2 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-sm">
                          {METODOS_PAGAMENTO.map(m => <option key={m.value} value={m.value}>{m.label}</option>)}
                        </select>
                        <input type="number" step="0.01" min="0" placeholder="0,00" value={p.valor}
                               onChange={e=>updateLinha(p.id,'valor', e.target.value.replace(',','.'))}
                               className="flex-1 min-w-[90px] px-2 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-sm outline-none focus:ring-4 focus:ring-blue-500/20"/>
                        <button type="button" onClick={()=>removeLinha(p.id)} title="Remover"
                                className="p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600">
                          <Icon name="x" className="w-4 h-4" />
                        </button>
                      </div>
              ))}
              <div className="flex items-center justify-between flex-wrap gap-2 pt-1">
                <button type="button" onClick={addLinha}
                        className="inline-flex items-center gap-1 text-sm font-medium text-blue-600 dark:text-blue-400 hover:underline">
                  <Icon name="plus" className="w-3.5 h-3.5" /> Adicionar forma de pagamento
                </button>
                <span className={'text-xs font-semibold px-2 py-1 rounded-lg '+(bateCerto ? 'text-emerald-700 bg-emerald-100 dark:text-emerald-300 dark:bg-emerald-900/30' : 'text-amber-700 bg-amber-100 dark:text-amber-300 dark:bg-amber-900/30')}>
              {bateCerto
                      ? 'Total conferido ✓'
                      : (restante > 0 ? `Falta ${formatBRL(restante)}` : `Excedeu ${formatBRL(-restante)}`)}
            </span>
              </div>
            </div>
    )
  }

  function AddForm({onAdd}){
    const [placa, setPlaca] = useState('');
    const [tipo, setTipo] = useState('carro');
    const [valor, setValor] = useState('');
    const [pago, setPago] = useState(false);
    const [pagamentos, setPagamentos] = useState([]);
    const [saving, setSaving] = useState(false);

    function togglePago(checked){
      setPago(checked);
      if(checked && pagamentos.length === 0){
        setPagamentos([{ id: uuid(), metodo: 'dinheiro', valor: valor || '' }]);
      }
      if(!checked){
        setPagamentos([]);
      }
    }

    async function handleSubmit(e){
      e.preventDefault();
      if(!placa.trim() || saving) return;

      let pagamentosFinal = [];
      if(pago){
        const total = somaPagamentos(pagamentos);
        const valorNum = Number(valor) || 0;
        if(pagamentos.length === 0){
          alert('Adicione ao menos uma forma de pagamento.');
          return;
        }
        if(Math.abs(total - valorNum) > 0.01){
          alert('A soma dos pagamentos (' + formatBRL(total) + ') precisa ser igual ao valor total (' + formatBRL(valorNum) + ').');
          return;
        }
        pagamentosFinal = pagamentos.map(p => ({ id: p.id || uuid(), metodo: p.metodo, valor: Number(p.valor) || 0 }));
      }

      const novo = {
        id: uuid(),
        placa: placa.trim().toUpperCase(),
        tipo,
        valor: Number(valor)||0,
        pago,
        pagamentos: pagamentosFinal,
        entrada: Date.now()
      };

      setSaving(true);
      try{
        await onAdd(novo);
        setPlaca('');
        setValor('');
        setPago(false);
        setTipo('carro');
        setPagamentos([]);
      } finally {
        setSaving(false);
      }
    }

    return (
            <form onSubmit={handleSubmit} className="grid gap-3 p-3 sm:p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40 animate-fadeIn">
              <div className="grid gap-3 sm:grid-cols-2 md:grid-cols-12 md:items-end">
                <div className="md:col-span-3">
                  <label className="text-xs text-slate-500 dark:text-slate-400">Placa</label>
                  <input value={placa} onChange={e=>setPlaca(e.target.value)} placeholder="ABC-1234"
                         className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 outline-none focus:ring-4 focus:ring-blue-500/20"/>
                </div>
                <div>
                  <label className="text-xs text-slate-500 dark:text-slate-400">Tipo</label>
                  <select value={tipo} onChange={e=>setTipo(e.target.value)}
                          className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 outline-none focus:ring-4 focus:ring-blue-500/20">
                    <option value="carro">Carro</option>
                    <option value="moto">Moto</option>
                  </select>
                </div>
                <div className="md:col-span-2">
                  <label className="text-xs text-slate-500 dark:text-slate-400">Valor (R$)</label>
                  <input value={valor} onChange={e=>setValor(e.target.value.replace(',','.'))} type="number" step="0.01" min="0" placeholder="0,00"
                         className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 outline-none focus:ring-4 focus:ring-blue-500/20"/>
                </div>
                <div className="flex items-center gap-2 sm:col-span-2 md:col-span-2">
                  <input id="pago" type="checkbox" checked={pago} onChange={e=>togglePago(e.target.checked)} className="w-4 h-4 rounded border-slate-300 text-blue-600"/>
                  <label htmlFor="pago" className="text-sm">Já pago na entrada</label>
                </div>
                <div className="sm:col-span-2 md:col-span-1 flex justify-end">
                  <button disabled={saving} className="w-full md:w-auto inline-flex items-center justify-center gap-2 px-4 py-2 rounded-xl bg-blue-600 text-white hover:brightness-110 active:scale-95 transition disabled:opacity-50">
                    <Icon name="plus" className="w-4 h-4" />
                    {saving ? 'Salvando...' : 'Adicionar'}
                  </button>
                </div>
              </div>

              {pago && (
                      <PaymentSplitEditor valorTotal={Number(valor)||0} pagamentos={pagamentos} setPagamentos={setPagamentos} />
              )}
            </form>
    )
  }

  function Row({item, onSetPagamentos, onUpdateValor, onDelete}){
    const [editingValor, setEditingValor] = useState(false);
    const [editingPagamento, setEditingPagamento] = useState(false);
    const [tempValor, setTempValor] = useState(item.valor);
    const [tempPagamentos, setTempPagamentos] = useState(
            item.pagamentos && item.pagamentos.length ? item.pagamentos : [{ id: uuid(), metodo: 'dinheiro', valor: item.valor }]
    );
    const [saving, setSaving] = useState(false);

    // REGRA: depois que o pagamento é confirmado, o veículo fica travado —
    // não é mais possível editar valor nem forma de pagamento, só excluir
    // o registro caso tenha sido um engano. Evita reabrir um recibo já fechado.
    const travado = item.pago;

    async function saveValor(){
      if(saving) return;
      setSaving(true);
      try{
        await onUpdateValor(item.id, Number(tempValor)||0);
        setEditingValor(false);
      } finally {
        setSaving(false);
      }
    }

    function openPagamentoEditor(){
      setTempPagamentos([{ id: uuid(), metodo: 'dinheiro', valor: item.valor }]);
      setEditingPagamento(true);
    }

    async function confirmarPagamento(){
      if(saving) return;
      const total = somaPagamentos(tempPagamentos);
      if(tempPagamentos.length === 0){
        alert('Adicione ao menos uma forma de pagamento.');
        return;
      }
      if(Math.abs(total - item.valor) > 0.01){
        alert('A soma dos pagamentos (' + formatBRL(total) + ') precisa ser igual ao valor total (' + formatBRL(item.valor) + ').');
        return;
      }
      setSaving(true);
      try{
        await onSetPagamentos(item.id, tempPagamentos.map(p => ({ id: p.id || uuid(), metodo: p.metodo, valor: Number(p.valor) || 0 })));
        setEditingPagamento(false);
      } finally {
        setSaving(false);
      }
    }

    return (
            <div className="p-3 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40 hover:shadow-sm transition animate-fadeIn">
              <div className="flex items-center gap-3 flex-wrap">
            <span className={'inline-flex items-center justify-center w-10 h-10 shrink-0 rounded-xl '+(item.tipo==='carro' ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-300' : 'bg-fuchsia-500/10 text-fuchsia-600 dark:text-fuchsia-300')}>
              <Icon name={item.tipo==='carro'?'car':'motorbike'} className="w-5 h-5" />
            </span>
                <div className="flex-1 min-w-[110px]">
                  <div className="font-semibold tracking-wide">{item.placa}</div>
                  <div className="text-xs text-slate-500 dark:text-slate-400">{new Date(item.entrada).toLocaleString('pt-BR')}</div>
                </div>

                {!editingValor ? (
                        <div className="text-right ml-auto sm:ml-0">
                          <div className={"text-sm font-medium "+(item.pago?'text-emerald-600 dark:text-emerald-400':'text-amber-600 dark:text-amber-400')}>
                            {item.pago
                                    ? ('Pago (' + (item.pagamentos||[]).map(p => metodoLabel(p.metodo) + ' ' + formatBRL(p.valor)).join(' + ') + ')')
                                    : 'Pendente'}
                          </div>
                          <div className="text-lg font-semibold">{formatBRL(item.valor)}</div>
                        </div>
                ) : (
                        <div className="flex items-center gap-2 ml-auto sm:ml-0">
                          <input type="number" step="0.01" min="0" value={tempValor} onChange={e=>setTempValor(e.target.value)} className="w-24 sm:w-28 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900" />
                          <button onClick={saveValor} disabled={saving} className="px-3 py-2 rounded-xl bg-emerald-600 text-white hover:brightness-110 disabled:opacity-50">Salvar</button>
                        </div>
                )}

                <div className="flex items-center gap-1">
                  {!travado && (
                          <button onClick={()=> editingPagamento ? setEditingPagamento(false) : openPagamentoEditor()} title="Confirmar pagamento" className="p-2.5 sm:p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition"><Icon name="badge-check" className="w-5 h-5" /></button>
                  )}
                  {!travado && (
                          <button onClick={()=>setEditingValor(v=>!v)} title="Editar valor" className="p-2.5 sm:p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition"><Icon name="pencil" className="w-5 h-5" /></button>
                  )}
                  {travado && (
                          <span title="Pagamento confirmado — não pode ser alterado" className="p-2.5 sm:p-2 rounded-xl text-emerald-600 dark:text-emerald-400"><Icon name="lock" className="w-5 h-5" /></span>
                  )}
                  <button onClick={()=>onDelete(item.id)} title="Remover" className="p-2.5 sm:p-2 rounded-xl hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600"><Icon name="trash-2" className="w-5 h-5" /></button>
                </div>
              </div>

              {editingPagamento && !travado && (
                      <div className="mt-3 grid gap-2">
                        <PaymentSplitEditor valorTotal={item.valor} pagamentos={tempPagamentos} setPagamentos={setTempPagamentos} />
                        <div className="flex items-center justify-end gap-2 flex-wrap">
                          <button type="button" onClick={()=>setEditingPagamento(false)} className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-800">Cancelar</button>
                          <button type="button" onClick={confirmarPagamento} disabled={saving} className="px-3 py-1.5 rounded-xl bg-emerald-600 text-white hover:brightness-110 disabled:opacity-50">
                            {saving ? 'Confirmando...' : 'Confirmar pagamento'}
                          </button>
                        </div>
                      </div>
              )}
            </div>
    )
  }

  function List({items, search, tab, paymentFilter, ...handlers}){
    const filtered = items.filter(it =>
            (tab==='todos' || it.tipo===tab) &&
            it.placa.toLowerCase().includes(search.toLowerCase()) &&
            (paymentFilter==='todos' ||
                    (paymentFilter==='pagos' && it.pago) ||
                    (paymentFilter==='pendentes' && !it.pago))
    );

    return (
            <div className="grid gap-3">
              {filtered.length === 0 && (
                      <div className="p-6 text-center rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/40 animate-fadeIn">
                        <div className="mx-auto w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 mb-2 flex items-center justify-center"><Icon name="search-x" className="w-5 h-5" /></div>
                        <p className="text-sm text-slate-500 dark:text-slate-400">Nada por aqui… tente outra placa, ou adicione um veículo.</p>
                      </div>
              )}
              {filtered.map(item => (
                      <Row key={item.id} item={item} {...handlers} />
              ))}
            </div>
    )
  }

  function Section({id, title, subtitle, children, action}){
    return (
            <section id={id} className="scroll-mt-24 py-6">
              <div className="flex items-end justify-between mb-3 gap-2 flex-wrap">
                <div>
                  <h2 className="text-xl sm:text-2xl font-bold tracking-tight">{title}</h2>
                  {subtitle && <p className="text-sm text-slate-500 dark:text-slate-400">{subtitle}</p>}
                </div>
                {action}
              </div>
              {children}
            </section>
    )
  }

  function useTheme(){
    const [theme, setTheme] = useState(() => {
      const saved = localStorage.getItem('theme');
      if(saved) return saved;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    });
    useEffect(()=>{
      const root = document.documentElement;
      if(theme==='dark') root.classList.add('dark'); else root.classList.remove('dark');
      localStorage.setItem('theme', theme);
    }, [theme]);
    return [theme, setTheme];
  }

  function App(){
    const [theme, setTheme] = useTheme();
    const [items, setItems] = useState([]);
    const [loading, setLoading] = useState(true);
    const [tab, setTab] = useState('todos');
    const [search, setSearch] = useState('');
    const [paymentFilter, setPaymentFilter] = useState('todos');

    useEffect(()=>{ loadItems(); }, []);

    useEffect(()=>{
      const src = new EventSource('/eventos');
      src.addEventListener('atualizacao', () => {
        loadItems();
      });
      src.onerror(() => {
        // EventSource reconecta automaticamente
      });
      return () => src.close();
    }, []);

    useEffect(()=>{
      setTimeout(()=>window?.lucide?.createIcons?.(), 0);
    }, [items, tab, search, theme, loading]);

    async function loadItems(){
      setLoading(true);
      try {
        const res = await fetch(API_BASE);
        if (!res.ok) throw new Error(await parseErro(res, 'Falha ao carregar dados'));
        const data = await res.json();
        setItems(data.map(migrateItem));
      } catch (err) {
        alert(err.message || 'Erro ao carregar dados');
      } finally {
        setLoading(false);
      }
    }

    async function addItem(novo){
      const placaNova = (novo.placa || '').trim().toUpperCase();
      if(items.some(i => ((i.placa||'').trim().toUpperCase() === placaNova))){
        alert('A placa ' + placaNova + ' já está cadastrada.');
        return;
      }
      try {
        const res = await fetch(API_BASE + '/Add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(novo)
        });
        if (!res.ok) throw new Error(await parseErro(res, 'Erro ao adicionar'));
        const saved = await res.json();
        setItems(prev => [migrateItem(saved), ...prev]);
      } catch (err) {
        alert(err.message || 'Erro ao adicionar');
      }
    }

    // Confirma o pagamento (possivelmente dividido em várias formas).
    // Depois de confirmado o item fica travado — ver `travado` em Row.
    async function setPagamentos(id, pagamentos){
      const item = items.find(i => i.id === id);
      if (!item) return;
      const updated = { ...item, pago: true, pagamentos };
      try {
        const res = await fetch(API_BASE + '/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updated)
        });
        if (!res.ok) throw new Error(await parseErro(res, 'Erro ao confirmar pagamento'));
        const saved = await res.json();
        setItems(prev => prev.map(i => i.id === id ? migrateItem(saved) : i));
      } catch (err) {
        alert(err.message || 'Erro ao confirmar pagamento');
      }
    }

    async function updateValor(id, valor){
      const item = items.find(i => i.id === id);
      if (!item) return;
      if (item.pago) return; // travado após pago
      const updated = { ...item, valor };
      try {
        const res = await fetch(API_BASE + '/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updated)
        });
        if (!res.ok) throw new Error(await parseErro(res, 'Erro ao atualizar valor'));
        const saved = await res.json();
        setItems(prev => prev.map(i => i.id === id ? migrateItem(saved) : i));
      } catch (err) {
        alert(err.message || 'Erro ao atualizar valor');
      }
    }

    async function removeItem(id){
      try {
        const res = await fetch(API_BASE + '/' + id, { method: 'DELETE' });
        if (!res.ok && res.status !== 204) throw new Error(await parseErro(res, 'Erro ao remover'));
        setItems(prev => prev.filter(i => i.id !== id));
      } catch (err) {
        alert(err.message || 'Erro ao remover');
      }
    }

    async function clearAll(){
      if(!confirm('Tem certeza que deseja limpar tudo?')) return;
      try {
        await Promise.all(items.map(item => fetch(API_BASE + '/' + item.id, { method: 'DELETE' })));
        setItems([]);
      } catch (err) {
        alert(err.message || 'Erro ao limpar');
      }
    }

    const carros = useMemo(()=> items.filter(i=>i.tipo==='carro'), [items]);
    const motos = useMemo(()=> items.filter(i=>i.tipo==='moto'), [items]);

    function totalPorMetodo(lista, metodo){
      return lista
              .filter(i => i.pago)
              .flatMap(i => i.pagamentos || [])
              .filter(p => p.metodo === metodo)
              .reduce((s,p) => s + (Number(p.valor)||0), 0);
    }

    function countPagamentos(lista, metodo){
      return lista
              .filter(i => i.pago)
              .flatMap(i => i.pagamentos || [])
              .filter(p => p.metodo === metodo)
              .length;
    }

    const totalCarrosPago = useMemo(()=> carros.filter(i=>i.pago).reduce((s,i)=>s+i.valor,0), [carros]);
    const totalCarrosDinheiro = useMemo(()=> totalPorMetodo(carros, 'dinheiro'), [carros]);
    const totalCarrosPix = useMemo(()=> totalPorMetodo(carros, 'pix'), [carros]);
    const pendCarros = useMemo(()=> carros.filter(i=>!i.pago).reduce((s,i)=>s+i.valor,0), [carros]);

    const totalMotosPago = useMemo(()=> motos.filter(i=>i.pago).reduce((s,i)=>s+i.valor,0), [motos]);
    const totalMotosDinheiro = useMemo(()=> totalPorMetodo(motos, 'dinheiro'), [motos]);
    const totalMotosPix = useMemo(()=> totalPorMetodo(motos, 'pix'), [motos]);
    const pendMotos = useMemo(()=> motos.filter(i=>!i.pago).reduce((s,i)=>s+i.valor,0), [motos]);

    if (loading) {
      return (
              <div className="flex items-center justify-center py-24 gap-2 text-slate-500 dark:text-slate-400">
                <Icon name="loader-circle" className="w-5 h-5 animate-spin" />
                Carregando...
              </div>
      );
    }

    return (
            <div className="grid gap-8">
              <Section id="inicio" title="Resumo" subtitle="Visão geral rápida do caixa e movimentação">
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3">
                  <StatCard icon="car" label="Carros pagos" value={formatBRL(totalCarrosPago)} sub={`${carros.filter(i=>i.pago).length} de ${carros.length}`} />
                  <StatCard icon="motorbike" label="Motos pagas" value={formatBRL(totalMotosPago)} sub={`${motos.filter(i=>i.pago).length} de ${motos.length}`} />
                  <StatCard icon="alarm-clock" label="Pend. Carros" value={formatBRL(pendCarros)} sub={`${carros.filter(i=>!i.pago).length} itens`} />
                  <StatCard icon="alarm-clock" label="Pend. Motos" value={formatBRL(pendMotos)} sub={`${motos.filter(i=>!i.pago).length} itens`} />
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3 mt-3">
                  <StatCard icon="wallet" label="Carro: Dinheiro" value={formatBRL(totalCarrosDinheiro)} sub={`${countPagamentos(carros, 'dinheiro')} pagamentos`} />
                  <StatCard icon="credit-card" label="Carro: Pix" value={formatBRL(totalCarrosPix)} sub={`${countPagamentos(carros, 'pix')} pagamentos`} />
                  <StatCard icon="wallet" label="Moto: Dinheiro" value={formatBRL(totalMotosDinheiro)} sub={`${countPagamentos(motos, 'dinheiro')} pagamentos`} />
                  <StatCard icon="credit-card" label="Moto: Pix" value={formatBRL(totalMotosPix)} sub={`${countPagamentos(motos, 'pix')} pagamentos`} />
                </div>
              </Section>

              <Section id="placas" title="Placas" subtitle="Gerencie entradas, pagamentos e valores" action={
                <a href="#relatorios" className="hidden md:inline-flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800">
                  <Icon name="pie-chart" className="w-4 h-4" />
                  Ir para Relatórios
                </a>
              }>
                <div className="grid gap-4">
                  <AddForm onAdd={addItem} />

                  <div className="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
                    <Tabs tab={tab} setTab={setTab} />
                    <PaymentFilter paymentFilter={paymentFilter} setPaymentFilter={setPaymentFilter} />
                    <div className="flex-1"></div>
                    <div className="relative">
                      <Icon name="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar placa..."
                             className="w-full sm:w-64 pl-9 pr-3 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 outline-none focus:ring-4 focus:ring-blue-500/20"/>
                    </div>
                  </div>

                  <List items={items} search={search} tab={tab} paymentFilter={paymentFilter}
                        onSetPagamentos={setPagamentos} onUpdateValor={updateValor} onDelete={removeItem}
                  />
                </div>
              </Section>

              <Section id="relatorios" title="Relatórios" subtitle="Totais por tipo, status e método de pagamento">
                <div className="grid md:grid-cols-2 gap-4">
                  <div className="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40">
                    <h3 className="font-semibold mb-2 flex items-center gap-2"><Icon name="car" className="w-5 h-5" />Carros</h3>
                    <ul className="text-sm grid gap-1">
                      <li className="flex justify-between"><span>Arrecadado (pagos)</span><span className="font-semibold">{formatBRL(totalCarrosPago)}</span></li>
                      <li className="flex justify-between"><span className="ml-4">→ Dinheiro</span><span className="font-semibold">{formatBRL(totalCarrosDinheiro)}</span></li>
                      <li className="flex justify-between"><span className="ml-4">→ Pix</span><span className="font-semibold">{formatBRL(totalCarrosPix)}</span></li>
                      <li className="flex justify-between"><span>Pendente</span><span className="font-semibold">{formatBRL(pendCarros)}</span></li>
                      <li className="flex justify-between"><span>Itens</span><span className="font-semibold">{carros.length}</span></li>
                    </ul>
                  </div>
                  <div className="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40">
                    <h3 className="font-semibold mb-2 flex items-center gap-2"><Icon name="motorbike" className="w-5 h-5" />Motos</h3>
                    <ul className="text-sm grid gap-1">
                      <li className="flex justify-between"><span>Arrecadado (pagos)</span><span className="font-semibold">{formatBRL(totalMotosPago)}</span></li>
                      <li className="flex justify-between"><span className="ml-4">→ Dinheiro</span><span className="font-semibold">{formatBRL(totalMotosDinheiro)}</span></li>
                      <li className="flex justify-between"><span className="ml-4">→ Pix</span><span className="font-semibold">{formatBRL(totalMotosPix)}</span></li>
                      <li className="flex justify-between"><span>Pendente</span><span className="font-semibold">{formatBRL(pendMotos)}</span></li>
                      <li className="flex justify-between"><span>Itens</span><span className="font-semibold">{motos.length}</span></li>
                    </ul>
                  </div>
                </div>
              </Section>

              <Section id="config" title="Configurações" subtitle="Tema, backup e mais">
                <div className="grid gap-4">
                  <div className="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40">
                    <div className="flex items-center justify-between flex-wrap gap-3">
                      <div>
                        <div className="font-semibold">Tema</div>
                        <div className="text-sm text-slate-500 dark:text-slate-400">Claro ou escuro</div>
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={()=>setTheme('light')} className={'px-3 py-1.5 rounded-xl border '+(theme==='light'?'bg-blue-600 text-white border-blue-600 shadow-glow':'border-slate-200 dark:border-slate-800')}>Claro</button>
                        <button onClick={()=>setTheme('dark')} className={'px-3 py-1.5 rounded-xl border '+(theme==='dark'?'bg-blue-600 text-white border-blue-600 shadow-glow':'border-slate-200 dark:border-slate-800')}>Escuro</button>
                        <button onClick={()=>setTheme(theme==='dark'?'light':'dark')} className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-800">Alternar</button>
                      </div>
                    </div>
                  </div>

                  <div className="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40">
                    <div className="flex items-center justify-between flex-wrap gap-3">
                      <div>
                        <div className="font-semibold">Dados</div>
                        <div className="text-sm text-slate-500 dark:text-slate-400">Backup (exporta o que está carregado) e restauração via API</div>
                      </div>
                      <div className="flex items-center gap-2 flex-wrap">
                        <button onClick={()=>{
                          const blob = new Blob([JSON.stringify(items, null, 2)], {type:'application/json'});
                          const url = URL.createObjectURL(blob);
                          const a = Object.assign(document.createElement('a'), { href:url, download:'backup_estaciona_plus.json' });
                          a.click(); URL.revokeObjectURL(url);
                        }}
                                className="px-3 py-1.5 rounded-xl bg-emerald-600 text-white hover:brightness-110">Exportar</button>
                        <label className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-800 cursor-pointer">
                          Importar
                          <input type="file" accept="application/json" className="hidden" onChange={e=>{
                            const file = e.target.files?.[0];
                            if(!file) return;
                            const reader = new FileReader();
                            reader.onload = async () => {
                              try{
                                const raw = JSON.parse(reader.result);
                                const data = Array.isArray(raw) ? raw : (Array.isArray(raw?.items) ? raw.items : null);
                                if(!data){ alert('Arquivo inválido'); return; }
                                const itensMigrados = data.map(migrateItem);
                                for(const item of itensMigrados){
                                  await fetch(API_BASE + '/Add', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(item)
                                  });
                                }
                                await loadItems();
                              }
                              catch{ alert('Falha ao importar'); }
                            };
                            reader.readAsText(file);
                          }}/>
                        </label>
                        <button onClick={clearAll} className="px-3 py-1.5 rounded-xl bg-red-600 text-white hover:brightness-110">Limpar tudo</button>
                      </div>
                    </div>
                  </div>
                </div>
              </Section>
            </div>
    )
  }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    const themeBtn = document.getElementById('themeToggle');
    themeBtn?.addEventListener('click', () => {
      const isDark = document.documentElement.classList.contains('dark');
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    });
  </script>
</body>
</html>
